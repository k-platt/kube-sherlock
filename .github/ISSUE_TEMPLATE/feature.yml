name: Feature
description: New behavior for the factory to build
title: "feat: "
labels: ["type:feature", "factory:ready"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should exist, and why? 1–3 sentences.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable, testable behaviors. Include exact commands and expected output or exit codes.
      value: |
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: What the agent should NOT do.
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Hints, constraints, related code. Optional.
